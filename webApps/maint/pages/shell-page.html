<!--
  Shell, laid out like Visual Builder's Redwood starter application:
  oj-sp-pillar-theme wraps everything, the flows render in oj-vb-content,
  and oj-sp-in-app-navigation switches between them.
-->
<div id="pageContent">
  <oj-sp-pillar-theme id="ojspPillarTheme" pillar="gbu" theme="default" mode="mixed"
    base-appearance-theme="Redwood" ask-oracle="off">
    <div class="oj-web-applayout-page">

      <header class="mx-appbar" role="banner">
        <button type="button" class="mx-appbar-brand" on-click="[[$listeners.goHome]]" aria-label="Maintenance home">
          <span class="oj-ux-ico-box mx-appbar-logo" aria-hidden="true"></span>
          <span class="oj-typography-body-md oj-typography-semi-bold">Maintenance</span>
        </button>
        <span class="oj-badge oj-badge-subtle oj-badge-info mx-appbar-tag">Sample data</span>
        <span class="mx-appbar-spacer"></span>
        <oj-button chroming="borderless" on-oj-action="[[$listeners.bellClick]]"
          :title="[[ $application.variables.counts.pending + ' ' + $application.functions.plural($application.variables.counts.pending, 'request is', 'requests are') + ' waiting for approval' ]]">
          <oj-bind-text value="[[ 'Approvals (' + $application.variables.counts.pending + ')' ]]"></oj-bind-text>
        </oj-button>
        <oj-button chroming="borderless" on-oj-action="[[$listeners.resetDemo]]" title="Put the sample data back to how it started">Reset sample data</oj-button>
        <oj-avatar class="mx-appbar-avatar" size="xs" initials="DU" role="img" aria-label="Demo user" title="Demo user"></oj-avatar>
      </header>

      <div class="oj-web-applayout-content-nopad oj-sm-margin-4x">
        <!-- Toasts: chains set $application.variables.messages -->
        <oj-messages messages="[[ $application.variables.messages ]]" display="notification" position="{}"></oj-messages>

        <div>
          <!-- Renders the selected flow -->
          <oj-vb-content id="vbRouterContent" class="oj-sm-12" config="[[vbRouterFlow]]"></oj-vb-content>

          <!-- Redwood in-app navigation: one item per flow, highlighted from the current flow -->
          <oj-sp-in-app-navigation
            navigation-data="[[ $variables.navigationADP ]]"
            selection="{{ $page.currentFlow }}"
            on-sp-selection-action="[[$listeners.navigationSelection]]"></oj-sp-in-app-navigation>
        </div>
      </div>
    </div>
  </oj-sp-pillar-theme>
</div>
