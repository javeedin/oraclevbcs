<!--
  Requests: Oracle's Redwood smart search page template (oj-sp-smart-search-page).
  The primary action is "Create request"; the search field sits in the template's "search" slot.
  Selecting a request ID opens a drawer built on the Redwood general drawer template.
-->
<oj-sp-smart-search-page class="oj-flex-item oj-sm-12 oj-md-12" display-mode="mixed"
  page-title="Requests"
  page-subtitle="Track every request from draft to completed work"
  primary-action.label="Create request"
  on-sp-primary-action="[[$listeners.createRequest]]">

  <oj-input-search slot="search" class="oj-form-control-width-md"
    value="{{ $variables.search }}"
    placeholder="Search by ID, title, equipment or person"
    aria-label="Search requests"
    on-raw-value-changed="[[$listeners.searchChanged]]"></oj-input-search>

  <div class="oj-sm-padding-4x">

    <oj-bind-if test="[[ $variables.draftCount > 0 ]]">
      <div class="mx-banner" role="status">
        <span class="mx-banner-text">
          <oj-bind-text value="[[ 'You have ' + $variables.draftCount + ' draft ' + $application.functions.plural($variables.draftCount, 'request', 'requests') + ' that ' + $application.functions.plural($variables.draftCount, 'has', 'have') + ' not been sent for approval.' ]]"></oj-bind-text>
        </span>
        <oj-button chroming="outlined" on-oj-action="[[$listeners.sendForApproval]]">Send for approval</oj-button>
      </div>
    </oj-bind-if>

    <div class="mx-toolbar">
      <oj-select-single class="mx-filter" label-hint="Status" label-edge="inside"
        data="[[ $variables.statusOptionsADP ]]"
        value="{{ $variables.statusFilter }}"
        on-value-changed="[[$listeners.statusChanged]]"></oj-select-single>
      <oj-buttonset-one value="{{ $variables.scope }}" chroming="outlined" aria-label="Raised by"
        on-value-changed="[[$listeners.scopeChanged]]">
        <oj-option value="all">Everyone</oj-option>
        <oj-option value="mine">Raised by me</oj-option>
      </oj-buttonset-one>
      <span class="mx-toolbar-spacer"></span>
      <span class="oj-text-color-secondary">
        <oj-bind-text value="[[ $variables.shownCount + ' ' + $application.functions.plural($variables.shownCount, 'request', 'requests') ]]"></oj-bind-text>
      </span>
    </div>

    <oj-table class="mx-table"
      scroll-policy="loadAll"
      data="[[ $variables.requestsADP ]]"
      columns="[[ $variables.columns ]]"
      horizontal-grid-visible="enabled"
      vertical-grid-visible="disabled"
      aria-label="Maintenance requests">

      <template slot="requestTemplate">
        <span class="mx-block">
          <button type="button" class="mx-link" on-click="[[$listeners.openRequest]]"><oj-bind-text value="[[ $current.row.id ]]"></oj-bind-text></button>
          <button type="button" class="mx-link mx-link-quiet" on-click="[[$listeners.openWorkflow]]" :aria-label="[[ 'Workflow of ' + $current.row.id ]]">Workflow</button>
        </span>
        <span class="mx-block oj-typography-semi-bold"><oj-bind-text value="[[ $current.row.title ]]"></oj-bind-text></span>
      </template>

      <template slot="equipmentTemplate">
        <span class="mx-block"><oj-bind-text value="[[ $current.row.equipmentName ]]"></oj-bind-text></span>
        <span class="mx-block oj-text-color-secondary"><oj-bind-text value="[[ $current.row.location ]]"></oj-bind-text></span>
      </template>

      <template slot="priorityTemplate">
        <span :class="[[ $application.functions.priorityBadgeClass($current.data) ]]"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></span>
      </template>

      <template slot="statusTemplate">
        <span :class="[[ $application.functions.badgeClass($current.data) ]]"><oj-bind-text value="[[ $current.data ]]"></oj-bind-text></span>
      </template>

      <template slot="raisedTemplate">
        <span class="mx-block"><oj-bind-text value="[[ $application.functions.fmtDate($current.data) ]]"></oj-bind-text></span>
        <span class="mx-block oj-text-color-secondary"><oj-bind-text value="[[ $current.row.requestedBy ]]"></oj-bind-text></span>
      </template>

      <template slot="neededTemplate">
        <oj-bind-text value="[[ $current.data ? $application.functions.fmtDate($current.data) : '—' ]]"></oj-bind-text>
      </template>

      <template slot="nextTemplate">
        <oj-bind-if test="[[ $current.row.waitingFor ]]">
          <span><oj-bind-text value="[[ $current.row.waitingFor ]]"></oj-bind-text></span>
        </oj-bind-if>
        <oj-bind-if test="[[ !$current.row.waitingFor && $current.row.workOrderId ]]">
          <span><oj-bind-text value="[[ 'Work order ' + $current.row.workOrderId ]]"></oj-bind-text></span>
        </oj-bind-if>
        <oj-bind-if test="[[ !$current.row.waitingFor && !$current.row.workOrderId ]]">
          <span class="oj-text-color-secondary"><oj-bind-text value="[[ $current.row.status === 'Draft' ? 'Not sent yet' : '—' ]]"></oj-bind-text></span>
        </oj-bind-if>
      </template>

      <template slot="noData">
        <p class="oj-text-color-secondary oj-sm-padding-4x">No requests match this search and filter.</p>
      </template>
    </oj-table>
  </div>
</oj-sp-smart-search-page>

<!-- ============ Request details: Redwood general drawer template ============ -->
<oj-drawer-popup class="mx-drawer" edge="end" modality="modal" opened="{{ $variables.detailOpen }}" aria-label="Request details">
  <oj-sp-general-drawer-template
    drawer-title="[[ $variables.selected.id ? $variables.selected.id + ' · ' + $variables.selected.title : 'Request' ]]"
    on-sp-close="[[$listeners.closeDetail]]">

    <div class="mx-drawer-body">
      <oj-buttonset-one class="mx-drawer-tabs" value="{{ $variables.detailView }}" chroming="outlined" aria-label="View">
        <oj-option value="details">Details</oj-option>
        <oj-option value="workflow">Workflow</oj-option>
      </oj-buttonset-one>

      <!-- ============ Workflow: the request as a flow diagram ============ -->
      <oj-bind-if test="[[ $variables.detailView === 'workflow' ]]">
        <div>
          <div class="mx-flow-head">
            <span class="oj-typography-subheading-xs"><oj-bind-text value="[[ $variables.workflowHeadline ]]"></oj-bind-text></span>
            <span class="mx-flow-legend" aria-hidden="true">
              <span class="mx-flow-key is-done">Done</span>
              <span class="mx-flow-key is-current">Now</span>
              <span class="mx-flow-key is-pending">Next</span>
              <span class="mx-flow-key is-skipped">Not needed</span>
            </span>
          </div>
          <ol class="mx-flow" aria-label="Request workflow">
            <oj-bind-for-each data="[[ $variables.workflow ]]">
              <template>
                <li :class="[[ 'mx-flow-step is-' + $current.data.state + ' is-' + $current.data.kind ]]">
                  <span class="mx-flow-marker" aria-hidden="true"><oj-bind-text value="[[ $functions.flowMark($current.data) ]]"></oj-bind-text></span>
                  <div class="mx-flow-box">
                    <div class="mx-flow-top">
                      <span class="oj-typography-semi-bold"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></span>
                      <span :class="[[ $functions.flowBadge($current.data.state) ]]"><oj-bind-text value="[[ $current.data.stateLabel ]]"></oj-bind-text></span>
                    </div>
                    <span class="mx-block oj-text-color-secondary oj-typography-body-sm"><oj-bind-text value="[[ $current.data.sub ]]"></oj-bind-text></span>
                    <oj-bind-if test="[[ $current.data.whenText ]]">
                      <span class="mx-block oj-typography-body-sm"><oj-bind-text value="[[ $current.data.whenText ]]"></oj-bind-text></span>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.comment ]]">
                      <span class="mx-block mx-quote oj-typography-body-sm"><oj-bind-text value="[[ '“' + $current.data.comment + '”' ]]"></oj-bind-text></span>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.kind === 'skip' ]]">
                      <span class="mx-flow-branch oj-typography-body-xs"><oj-bind-text value="[[ $current.data.branch ]]"></oj-bind-text></span>
                    </oj-bind-if>
                  </div>
                </li>
              </template>
            </oj-bind-for-each>
          </ol>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.detailView !== 'workflow' ]]">
      <div>
      <div class="mx-badges">
        <span :class="[[ $application.functions.badgeClass($variables.selected.status) ]]"><oj-bind-text value="[[ $variables.selected.status ]]"></oj-bind-text></span>
        <span :class="[[ $application.functions.priorityBadgeClass($variables.selected.priority) ]]"><oj-bind-text value="[[ $variables.selected.priority + ' priority' ]]"></oj-bind-text></span>
        <span class="oj-badge oj-badge-subtle"><oj-bind-text value="[[ $variables.selected.type ]]"></oj-bind-text></span>
        <oj-bind-if test="[[ $variables.selected.downtime ]]">
          <span class="oj-badge oj-badge-danger">Equipment down</span>
        </oj-bind-if>
      </div>

      <p><oj-bind-text value="[[ $variables.selected.description ]]"></oj-bind-text></p>

      <dl class="mx-facts">
        <div><dt>Equipment</dt><dd><oj-bind-text value="[[ $variables.selected.equipmentName ]]"></oj-bind-text></dd></div>
        <div><dt>Location</dt><dd><oj-bind-text value="[[ $variables.selected.location ]]"></oj-bind-text></dd></div>
        <div><dt>Raised by</dt><dd><oj-bind-text value="[[ $variables.selected.requestedBy ]]"></oj-bind-text></dd></div>
        <div><dt>Raised on</dt><dd><oj-bind-text value="[[ $application.functions.fmtDateTime($variables.selected.requestedOn) ]]"></oj-bind-text></dd></div>
        <div><dt>Needed by</dt><dd><oj-bind-text value="[[ $variables.selected.neededBy ? $application.functions.fmtDate($variables.selected.neededBy) : '—' ]]"></oj-bind-text></dd></div>
        <div><dt>Estimated cost</dt><dd><oj-bind-text value="[[ $application.functions.fmtMoney($variables.selected.estCost) ]]"></oj-bind-text></dd></div>
      </dl>

      <h3 class="oj-typography-subheading-xs mx-drawer-subtitle">Approval route</h3>
      <oj-bind-if test="[[ $variables.selected.route.length === 0 ]]">
        <p class="oj-text-color-secondary">Not sent for approval yet. The route is worked out when you send it.</p>
      </oj-bind-if>
      <ol class="mx-steps">
        <oj-bind-for-each data="[[ $variables.selected.route ]]">
          <template>
            <li class="mx-step">
              <span class="mx-step-num" aria-hidden="true"><oj-bind-text value="[[ $current.data.level ]]"></oj-bind-text></span>
              <span class="mx-step-text">
                <span class="mx-block oj-typography-semi-bold"><oj-bind-text value="[[ $current.data.role + ' · ' + $current.data.name ]]"></oj-bind-text></span>
                <span class="mx-block oj-text-color-secondary"><oj-bind-text value="[[ $functions.stepLine($current.data) ]]"></oj-bind-text></span>
                <oj-bind-if test="[[ $current.data.comment ]]">
                  <span class="mx-block mx-quote"><oj-bind-text value="[[ '“' + $current.data.comment + '”' ]]"></oj-bind-text></span>
                </oj-bind-if>
              </span>
              <span :class="[[ $application.functions.badgeClass($current.data.status) ]]"><oj-bind-text value="[[ $current.data.status ]]"></oj-bind-text></span>
            </li>
          </template>
        </oj-bind-for-each>
      </ol>

      <oj-bind-if test="[[ $variables.selected.workOrderId ]]">
        <div class="mx-banner" role="status">
          <span class="mx-banner-text"><oj-bind-text value="[[ 'Work order ' + $variables.selected.workOrderId + ' is on the work order board.' ]]"></oj-bind-text></span>
          <oj-button chroming="borderless" on-oj-action="[[$listeners.openWorkOrders]]">Open work orders</oj-button>
        </div>
      </oj-bind-if>

      <h3 class="oj-typography-subheading-xs mx-drawer-subtitle">Timeline</h3>
      <ol class="mx-timeline">
        <oj-bind-for-each data="[[ $variables.selected.history ]]">
          <template>
            <li class="mx-timeline-row">
              <span class="mx-block"><oj-bind-text value="[[ $current.data.text ]]"></oj-bind-text></span>
              <span class="mx-block oj-text-color-secondary"><oj-bind-text value="[[ $application.functions.fmtDateTime($current.data.at) ]]"></oj-bind-text></span>
            </li>
          </template>
        </oj-bind-for-each>
      </ol>
      </div>
      </oj-bind-if>

      <div class="mx-drawer-actions">
        <oj-button chroming="outlined" on-oj-action="[[$listeners.closeDetail]]">Close</oj-button>
        <oj-bind-if test="[[ $variables.selected.status === 'Draft' ]]">
          <oj-button chroming="callToAction" on-oj-action="[[$listeners.sendSelected]]">Send for approval</oj-button>
        </oj-bind-if>
      </div>
    </div>
  </oj-sp-general-drawer-template>
</oj-drawer-popup>
