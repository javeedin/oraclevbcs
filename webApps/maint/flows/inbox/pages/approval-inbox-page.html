<!--
  Approval inbox: Oracle's Redwood smart search page template.
  "Acting as" switches the approver role; each waiting request is a Redwood panel with Approve and Reject.
-->
<oj-sp-smart-search-page class="oj-flex-item oj-sm-12 oj-md-12" display-mode="mixed"
  page-title="Approval inbox"
  page-subtitle="Approving moves a request to its next approver, or creates the work order on the last step">

  <oj-input-search slot="search" class="oj-form-control-width-md"
    value="{{ $variables.search }}"
    placeholder="Search waiting requests"
    aria-label="Search waiting requests"
    on-raw-value-changed="[[$listeners.searchChanged]]"></oj-input-search>

  <div class="oj-sm-padding-4x">
    <div class="mx-toolbar">
      <span class="oj-typography-semi-bold" id="actingAsLabel">Acting as</span>
      <oj-buttonset-one value="{{ $variables.role }}" chroming="outlined" aria-labelledby="actingAsLabel"
        on-value-changed="[[$listeners.roleChanged]]">
        <oj-bind-for-each data="[[ $variables.roleTabs ]]">
          <template>
            <oj-option value="[[ $current.data.id ]]">
              <oj-bind-text value="[[ $current.data.role + ' (' + $current.data.count + ')' ]]"></oj-bind-text>
            </oj-option>
          </template>
        </oj-bind-for-each>
      </oj-buttonset-one>
    </div>

    <!-- ============ Empty state ============ -->
    <oj-bind-if test="[[ $variables.items.length === 0 ]]">
      <div class="oj-panel mx-panel mx-empty">
        <p class="oj-typography-subheading-xs">
          <oj-bind-text value="[[ $variables.searchText ? 'Nothing matches your search' : 'You are all caught up' ]]"></oj-bind-text>
        </p>
        <p class="oj-text-color-secondary"><oj-bind-text value="[[ 'Nothing else is waiting for the ' + $application.functions.roleText($variables.role) + '.' ]]"></oj-bind-text></p>
        <oj-button chroming="outlined" on-oj-action="[[$listeners.viewRequests]]">View all requests</oj-button>
      </div>
    </oj-bind-if>

    <!-- ============ Waiting items ============ -->
    <oj-bind-for-each data="[[ $variables.items ]]">
      <template>
        <article class="oj-panel mx-panel mx-approval">
          <div class="mx-badges">
            <button type="button" class="mx-link oj-typography-semi-bold" on-click="[[$listeners.openRequest]]"><oj-bind-text value="[[ $current.data.id ]]"></oj-bind-text></button>
            <span :class="[[ $application.functions.priorityBadgeClass($current.data.priority) ]]"><oj-bind-text value="[[ $current.data.priority ]]"></oj-bind-text></span>
            <span class="oj-badge oj-badge-subtle"><oj-bind-text value="[[ $current.data.type ]]"></oj-bind-text></span>
            <oj-bind-if test="[[ $current.data.downtime ]]">
              <span class="oj-badge oj-badge-danger">Equipment down</span>
            </oj-bind-if>
            <span class="mx-toolbar-spacer"></span>
            <span class="oj-text-color-secondary"><oj-bind-text value="[[ $current.data.stepLabel + ' · raised ' + $application.functions.relDays($current.data.requestedOn) ]]"></oj-bind-text></span>
          </div>

          <h2 class="oj-typography-subheading-sm mx-approval-title"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></h2>
          <p><oj-bind-text value="[[ $current.data.description ]]"></oj-bind-text></p>

          <dl class="mx-facts mx-facts--4">
            <div><dt>Equipment</dt><dd><oj-bind-text value="[[ $current.data.equipmentName ]]"></oj-bind-text></dd></div>
            <div><dt>Location</dt><dd><oj-bind-text value="[[ $current.data.location ]]"></oj-bind-text></dd></div>
            <div><dt>Raised by</dt><dd><oj-bind-text value="[[ $current.data.requestedBy ]]"></oj-bind-text></dd></div>
            <div><dt>Estimated cost</dt><dd><oj-bind-text value="[[ $application.functions.fmtMoney($current.data.estCost) ]]"></oj-bind-text></dd></div>
          </dl>

          <div class="mx-badges" aria-label="Approval route">
            <oj-bind-for-each data="[[ $current.data.route ]]">
              <template>
                <span :class="[[ $application.functions.badgeClass($current.data.status) ]]" :title="[[ $current.data.name + ' · ' + $current.data.status ]]">
                  <oj-bind-text value="[[ $current.data.level + '. ' + $current.data.role + ' · ' + $current.data.status ]]"></oj-bind-text>
                </span>
              </template>
            </oj-bind-for-each>
          </div>

          <div class="mx-actions">
            <span class="oj-text-color-secondary"><oj-bind-text value="[[ $current.data.neededBy ? 'Needed by ' + $application.functions.fmtDate($current.data.neededBy) : '' ]]"></oj-bind-text></span>
            <span class="mx-toolbar-spacer"></span>
            <oj-button chroming="outlined" on-oj-action="[[$listeners.reject]]">Reject</oj-button>
            <oj-button chroming="callToAction" on-oj-action="[[$listeners.approve]]">Approve</oj-button>
          </div>
        </article>
      </template>
    </oj-bind-for-each>
  </div>
</oj-sp-smart-search-page>

<!-- ============ Reject dialog ============ -->
<oj-dialog id="rejectDialog" class="mx-dialog" dialog-title="Reject request" cancel-behavior="icon">
  <div slot="body">
    <p class="oj-typography-semi-bold"><oj-bind-text value="[[ $variables.rejectId + ' · ' + $variables.rejectTitle ]]"></oj-bind-text></p>
    <p class="oj-text-color-secondary">The requester sees your reason on the request timeline.</p>
    <oj-text-area id="rejectReason" class="oj-form-control-full-width"
      label-hint="Reason for rejecting"
      rows="4"
      length.max="300"
      value="{{ $variables.rejectComment }}"></oj-text-area>
    <oj-bind-if test="[[ $variables.rejectError ]]">
      <p class="oj-text-color-danger" role="alert"><oj-bind-text value="[[ $variables.rejectError ]]"></oj-bind-text></p>
    </oj-bind-if>
  </div>
  <div slot="footer">
    <oj-button chroming="borderless" on-oj-action="[[$listeners.cancelReject]]">Cancel</oj-button>
    <oj-button chroming="callToAction" on-oj-action="[[$listeners.confirmReject]]">Reject request</oj-button>
  </div>
</oj-dialog>
