<!--
  Work orders: Oracle's Redwood smart search page template with a three-lane board.
  The primary action opens the approval inbox, where approvals create new work orders.
-->
<oj-sp-smart-search-page class="oj-flex-item oj-sm-12 oj-md-12" display-mode="mixed"
  page-title="Work orders"
  page-subtitle="[[ $variables.subtitle ]]"
  primary-action.label="Approval inbox"
  on-sp-primary-action="[[$listeners.viewInbox]]">

  <oj-input-search slot="search" class="oj-form-control-width-md"
    value="{{ $variables.search }}"
    placeholder="Search by work order, request, equipment or technician"
    aria-label="Search work orders"
    on-raw-value-changed="[[$listeners.searchChanged]]"></oj-input-search>

  <div class="oj-sm-padding-4x">
    <p class="oj-text-color-secondary">A work order is created automatically when a request gets its last approval. Start it, then mark it complete to put the equipment back in service.</p>

    <div class="mx-board">
      <oj-bind-for-each data="[[ $variables.board ]]">
        <template>
          <section class="mx-lane" :aria-label="[[ $current.data.title ]]">
            <div class="mx-lane-head">
              <h2 class="oj-typography-subheading-xs"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></h2>
              <span class="oj-badge oj-badge-subtle"><oj-bind-text value="[[ $current.data.count ]]"></oj-bind-text></span>
            </div>
            <p class="oj-text-color-secondary oj-typography-body-sm"><oj-bind-text value="[[ $current.data.note ]]"></oj-bind-text></p>

            <oj-bind-for-each data="[[ $current.data.items ]]">
              <template>
                <article class="oj-panel mx-panel mx-wo">
                  <div class="mx-badges">
                    <span class="oj-typography-semi-bold"><oj-bind-text value="[[ $current.data.id ]]"></oj-bind-text></span>
                    <span :class="[[ $application.functions.priorityBadgeClass($current.data.priority) ]]"><oj-bind-text value="[[ $current.data.priority ]]"></oj-bind-text></span>
                    <span class="mx-toolbar-spacer"></span>
                    <span class="oj-text-color-secondary oj-typography-body-sm"><oj-bind-text value="[[ $current.data.whenLine ]]"></oj-bind-text></span>
                  </div>
                  <h3 class="oj-typography-body-md oj-typography-semi-bold mx-wo-title"><oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text></h3>
                  <p class="oj-text-color-secondary oj-typography-body-sm"><oj-bind-text value="[[ $current.data.equipmentName + ' · ' + $current.data.location ]]"></oj-bind-text></p>
                  <p class="oj-typography-body-sm"><oj-bind-text value="[[ 'Technician: ' + $current.data.technician ]]"></oj-bind-text></p>
                  <oj-bind-if test="[[ $current.data.status === 'In progress' ]]">
                    <div class="mx-health mx-health--wide">
                      <oj-progress-bar class="mx-progress" value="[[ $current.data.progress ]]" max="100" :aria-label="[[ $current.data.id + ' progress' ]]"></oj-progress-bar>
                      <span class="oj-typography-body-sm"><oj-bind-text value="[[ $current.data.progress + '%' ]]"></oj-bind-text></span>
                    </div>
                  </oj-bind-if>
                  <div class="mx-actions">
                    <button type="button" class="mx-link oj-typography-body-sm" on-click="[[$listeners.openRequest]]"><oj-bind-text value="[[ 'From ' + $current.data.requestId ]]"></oj-bind-text></button>
                    <span class="mx-toolbar-spacer"></span>
                    <oj-bind-if test="[[ $current.data.status === 'Scheduled' ]]">
                      <oj-button chroming="outlined" on-oj-action="[[$listeners.advance]]">Start work</oj-button>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.status === 'In progress' ]]">
                      <oj-button chroming="callToAction" on-oj-action="[[$listeners.advance]]">Mark complete</oj-button>
                    </oj-bind-if>
                    <oj-bind-if test="[[ $current.data.status === 'Completed' ]]">
                      <span class="oj-badge oj-badge-success">Done</span>
                    </oj-bind-if>
                  </div>
                </article>
              </template>
            </oj-bind-for-each>
            <oj-bind-if test="[[ $current.data.items.length === 0 ]]">
              <p class="oj-text-color-secondary">Nothing here.</p>
            </oj-bind-if>
          </section>
        </template>
      </oj-bind-for-each>
    </div>
  </div>
</oj-sp-smart-search-page>
