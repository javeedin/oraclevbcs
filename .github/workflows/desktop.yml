# Maintenance desktop client (Electron)
#
#  1. Linux: builds the Visual Builder app with Oracle's grunt tools, captures it as `grunt vb-serve`
#     serves it (desktop/app), and smoke-tests the desktop client with the real app under Xvfb
#     (bridge, secure key, header count, tray commands, Auto Pilot against a mock Claude API).
#  2. Windows: packages the installer, Maintenance-Setup.exe. On a v* tag (v1.0.1, ...) it publishes
#     a GitHub release: the app's "Download desktop app" button and the installed apps' automatic
#     updates both use the latest release.
#
# Release a version (the header's "Download desktop app" button takes the latest release):
#   - git tag v<version> && git push origin v<version>; or
#   - Actions > Desktop app > Run workflow, tick "Publish a release" (GitHub shows this button once
#     this file is also on the default branch, main);
# where <version> is "version" in desktop/package.json (bump it for each new release).
name: Desktop app

on:
  push:
    tags: ['v*']
    branches: ['feature/maintenance-redwood-templates']
    paths:
      - 'desktop/**'
      - 'webApps/**'
      - 'settings/**'
      - 'visual-application.json'
      - 'package.json'
      - 'Gruntfile.js'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release v<desktop/package.json version> from this branch'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build the app and smoke-test the desktop client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the versions match (desktop/package.json, app-flow.js, tag)
        run: |
          node -e "const v = require('./desktop/package.json').version; const m = require('fs').readFileSync('webApps/maint/app-flow.js', 'utf8').match(/const APP_VERSION = '([^']+)'/); if (!m || m[1] !== v) { console.log('::error title=Version mismatch::APP_VERSION in webApps/maint/app-flow.js (' + (m && m[1]) + ') must equal desktop/package.json version ' + v); process.exit(1); } const t = process.env.GITHUB_REF_NAME; if (process.env.GITHUB_REF.startsWith('refs/tags/v') && t !== 'v' + v) { console.log('::error title=Version mismatch::Tag ' + t + ' does not match version ' + v); process.exit(1); }"

      - name: Install Oracle's VB build tools
        run: node desktop/scripts/ci-step.js "Install VB build tools" -- npm install --no-audit --no-fund

      - name: Build the VB app and capture it for the desktop client
        run: node desktop/scripts/ci-step.js "Build the VB app" -- npm run build:desktop

      - name: Install the desktop client
        working-directory: desktop
        run: node scripts/ci-step.js "Install the desktop client" -- npm ci --no-audit --no-fund

      - name: Smoke test (Electron, the real app, a mock Claude API)
        working-directory: desktop
        env:
          MX_SELFTEST: '1'
          MX_SELFTEST_APP: '1'
          MX_CLAUDE_URL: http://127.0.0.1:18999/v1/messages
          MX_SELFTEST_OUT: ${{ github.workspace }}/selftest
        run: |
          which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          node scripts/ci-step.js "Desktop smoke test" -- xvfb-run -a npx electron . --no-sandbox

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: desktop/app/
          include-hidden-files: true

  windows:
    name: Windows installer
    needs: app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: desktop-app
          path: desktop/app

      - name: Install the desktop client
        working-directory: desktop
        run: node scripts/ci-step.js "Install the desktop client (Windows)" -- npm ci --no-audit --no-fund

      - name: Tag this commit for the release (manual run with "Publish a release")
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        run: |
          v="v$(node -p "require('./desktop/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" > /dev/null; then
            echo "::error title=Release exists::Tag $v already exists. Bump version in desktop/package.json first."
            exit 1
          fi
          git tag "$v" "$GITHUB_SHA"
          git push origin "refs/tags/$v"

      # electron-builder uploads the exe, latest.yml and the blockmap in parallel; when the release
      # doesn't exist yet each upload can create its own, and the tag then points at the wrong one
      # (v1.0.0 got two). Creating the release first gives the uploads one release to share.
      - name: Create the release (once)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./desktop/package.json').version")"
          if gh release view "$v" > /dev/null 2>&1; then
            echo "Release $v exists."
          else
            gh release create "$v" --verify-tag --title "${v#v}" --notes "Maintenance desktop app ${v#v}. Download Maintenance-Setup.exe below."
          fi

      - name: Package the installer (published as a release on a v* tag or a manual release run)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true' # upload into the release created above, however old it is
        run: node scripts/ci-step.js "Package the Windows installer" -- npx electron-builder --win --publish ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)) && 'always' || 'never' }}

      - uses: actions/upload-artifact@v4
        with:
          name: Maintenance-Setup
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
